<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard — AI Productivity Platform</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #070914;
    --sidebar: #0b0f1c;
    --card: rgba(255,255,255,.055);
    --border: rgba(255,255,255,.09);
    --text: #f5f7ff;
    --muted: #8991a5;
    --purple: #8b5cf6;
    --blue: #3b82f6;
    --green: #4ade80;
    --red: #fb7185;
}

body {
    min-height: 100vh;
    color: var(--text);
    background: var(--bg);
    font-family: Inter, sans-serif;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* APP */

.app {
    min-height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 240px;
    flex-shrink: 0;
    padding: 25px 16px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px 30px;
    font-family: "Space Grotesk";
    font-size: 14px;
    font-weight: 700;
}

.logo-icon {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    color: white;
    background: linear-gradient(135deg,var(--purple),var(--blue));
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.nav button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 10px;
    text-align: left;
    font-size: 12px;
}

.nav button:hover,
.nav button.active {
    color: white;
    background: rgba(139,92,246,.15);
}

.nav i {
    width: 18px;
    text-align: center;
}

.signout {
    width: 100%;
    margin-top: 30px;
    padding: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 10px;
}

.signout:hover {
    color: white;
    background: rgba(255,255,255,.05);
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    padding: 30px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

h1 {
    font-family: "Space Grotesk";
    font-size: 27px;
}

.subtitle {
    margin-top: 6px;
    color: var(--muted);
    font-size: 10px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 9px;
}

.avatar {
    width: 35px;
    height: 35px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    color: white;
    background: linear-gradient(135deg,var(--purple),var(--blue));
    font-size: 11px;
    font-weight: 700;
}

.profile strong {
    display: block;
    font-size: 10px;
}

.profile span {
    color: var(--muted);
    font-size: 8px;
}

/* WELCOME */

.welcome {
    padding: 25px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background:
        radial-gradient(
            circle at top right,
            rgba(139,92,246,.2),
            transparent 45%
        ),
        var(--card);
}

.welcome h2 {
    font-family: "Space Grotesk";
    font-size: 20px;
}

.welcome p {
    margin-top: 7px;
    color: var(--muted);
    font-size: 10px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 13px;
    margin-bottom: 18px;
}

.stat {
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
}

.stat i {
    color: #a78bfa;
    font-size: 13px;
}

.stat strong {
    display: block;
    margin-top: 10px;
    font-family: "Space Grotesk";
    font-size: 23px;
}

.stat span {
    color: var(--muted);
    font-size: 8px;
}

/* CONTENT */

.content {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 18px;
}

.card {
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.card-header h2 {
    font-family: "Space Grotesk";
    font-size: 13px;
}

.add-btn {
    padding: 8px 12px;
    color: white;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(135deg,var(--purple),var(--blue));
    font-size: 8px;
}

/* TASKS */

.task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
}

.task-check {
    width: 17px;
    height: 17px;
    accent-color: var(--purple);
}

.task-info {
    flex: 1;
}

.task-info strong {
    display: block;
    font-size: 9px;
}

.task-info span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 7px;
}

.delete {
    border: 0;
    color: var(--red);
    background: transparent;
}

/* QUICK ACTIONS */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.action {
    padding: 15px;
    color: var(--text);
    text-align: left;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(255,255,255,.025);
}

.action:hover {
    border-color: rgba(139,92,246,.4);
    background: rgba(139,92,246,.08);
}

.action i {
    color: #a78bfa;
    font-size: 13px;
}

.action strong {
    display: block;
    margin-top: 9px;
    font-size: 9px;
}

.action span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 7px;
}

/* MOBILE */

.mobile-menu {
    display: none;
}

@media(max-width:900px) {

    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .content {
        grid-template-columns: 1fr;
    }

}

@media(max-width:700px) {

    .sidebar {
        display: none;
    }

    .main {
        padding: 20px 15px;
    }

    .profile {
        display: none;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

}

</style>

</head>

<body>

<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">

        <div class="logo-icon">
            <i class="fa-solid fa-sparkles"></i>
        </div>

        AI Productivity

    </div>


    <nav class="nav">

        <button class="active"
        onclick="go('dashboard.html')">

            <i class="fa-solid fa-grid-2"></i>

            Dashboard

        </button>


        <button
        onclick="go('dashboard.html')">

            <i class="fa-solid fa-list-check"></i>

            Tasks

        </button>


        <button
        onclick="go('analytics.html')">

            <i class="fa-solid fa-chart-line"></i>

            Analytics

        </button>


        <button
        onclick="go('ai.html')">

            <i class="fa-solid fa-wand-magic-sparkles"></i>

            AI Assistant

        </button>


        <!-- SETTINGS -->

        <button
        onclick="go('settings.html')">

            <i class="fa-solid fa-gear"></i>

            Settings

        </button>

    </nav>


    <button
    class="signout"
    onclick="signOut()">

        <i class="fa-solid fa-right-from-bracket"></i>

        Sign Out

    </button>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">


<header class="topbar">

    <div>

        <h1>
            Dashboard
        </h1>

        <p class="subtitle">
            Your productivity command center.
        </p>

    </div>


    <div class="profile">

        <div
        class="avatar"
        id="avatar">

            U

        </div>


        <div>

            <strong id="userName">
                User
            </strong>

            <span>
                Productivity member
            </span>

        </div>

    </div>

</header>


<!-- WELCOME -->

<section class="welcome">

    <h2 id="welcomeText">
        Welcome back 👋
    </h2>

    <p>
        Stay focused, complete your priorities,
        and make today productive.
    </p>

</section>


<!-- STATS -->

<section class="stats">


    <div class="stat">

        <i class="fa-solid fa-list-check"></i>

        <strong id="totalTasks">
            0
        </strong>

        <span>
            Total tasks
        </span>

    </div>


    <div class="stat">

        <i class="fa-solid fa-circle-check"></i>

        <strong id="completedTasks">
            0
        </strong>

        <span>
            Completed
        </span>

    </div>


    <div class="stat">

        <i class="fa-solid fa-clock"></i>

        <strong id="remainingTasks">
            0
        </strong>

        <span>
            Remaining
        </span>

    </div>


    <div class="stat">

        <i class="fa-solid fa-chart-line"></i>

        <strong id="completionRate">
            0%
        </strong>

        <span>
            Completion rate
        </span>

    </div>


</section>


<!-- CONTENT -->

<section class="content">


<!-- TASKS -->

<div class="card">

    <div class="card-header">

        <h2>
            Today's Tasks
        </h2>

        <button
        class="add-btn"
        onclick="addTask()">

            <i class="fa-solid fa-plus"></i>

            Add Task

        </button>

    </div>


    <div
    class="task-list"
    id="taskList">

    </div>

</div>


<!-- QUICK ACTIONS -->

<div class="card">

    <div class="card-header">

        <h2>
            Quick Actions
        </h2>

    </div>


    <div class="actions">


        <button
        class="action"
        onclick="go('ai.html')">

            <i class="fa-solid fa-wand-magic-sparkles"></i>

            <strong>
                AI Assistant
            </strong>

            <span>
                Get productivity advice
            </span>

        </button>


        <button
        class="action"
        onclick="addTask()">

            <i class="fa-solid fa-plus"></i>

            <strong>
                Add Task
            </strong>

            <span>
                Create a new priority
            </span>

        </button>


        <button
        class="action"
        onclick="go('analytics.html')">

            <i class="fa-solid fa-chart-line"></i>

            <strong>
                View Analytics
            </strong>

            <span>
                Track your progress
            </span>

        </button>


        <button
        class="action"
        onclick="go('settings.html')">

            <i class="fa-solid fa-gear"></i>

            <strong>
                Settings
            </strong>

            <span>
                Customize your workspace
            </span>

        </button>


    </div>

</div>


</section>


</main>

</div>


<script>

/* =========================
   NAVIGATION
========================= */

function go(page) {

    window.location.href = page;

}


/* =========================
   PROFILE
========================= */

const profile =
JSON.parse(
    localStorage.getItem(
        "aiProductivityProfile"
    )
);


if (profile && profile.name) {

    document.getElementById(
        "userName"
    ).textContent = profile.name;


    document.getElementById(
        "welcomeText"
    ).textContent =
        "Welcome back, " +
        profile.name +
        " 👋";


    document.getElementById(
        "avatar"
    ).textContent =
        profile.name
        .charAt(0)
        .toUpperCase();

}


/* =========================
   TASKS
========================= */

let tasks =
JSON.parse(
    localStorage.getItem(
        "aiProductivityTasks"
    )
) || [];


function saveTasks() {

    localStorage.setItem(
        "aiProductivityTasks",
        JSON.stringify(tasks)
    );

}


/* =========================
   RENDER TASKS
========================= */

function renderTasks() {

    const list =
        document.getElementById(
            "taskList"
        );


    list.innerHTML = "";


    if (tasks.length === 0) {

        list.innerHTML = `

            <div style="
                padding:30px;
                text-align:center;
                color:#8991a5;
                font-size:9px;
            ">

                <i
                class="fa-solid fa-circle-check"
                style="
                    font-size:25px;
                    margin-bottom:10px;
                    display:block;
                    color:#8b5cf6;
                "></i>

                No tasks yet.

                <br>

                Add your first task to get started.

            </div>

        `;

        updateStats();

        return;

    }


    tasks.forEach(
        (task,index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "task";


            item.innerHTML = `

                <input
                    class="task-check"
                    type="checkbox"
                    ${task.done ? "checked" : ""}
                    onchange="toggleTask(${index})"
                >


                <div class="task-info">

                    <strong style="
                        ${task.done
                            ? "text-decoration:line-through;opacity:.5;"
                            : ""}
                    ">

                        ${escapeHTML(task.title)}

                    </strong>

                    <span>
                        ${task.done
                            ? "Completed"
                            : "Priority task"}
                    </span>

                </div>


                <button
                    class="delete"
                    onclick="deleteTask(${index})">

                    <i class="fa-solid fa-trash"></i>

                </button>

            `;


            list.appendChild(item);

        }
    );


    updateStats();

}


/* =========================
   ADD TASK
========================= */

function addTask() {

    const title =
        prompt(
            "What do you need to accomplish?"
        );


    if (!title) return;


    const cleanTitle =
        title.trim();


    if (!cleanTitle) return;


    tasks.push({

        title: cleanTitle,

        done: false,

        created:
            new Date().toISOString()

    });


    saveTasks();

    renderTasks();

}


/* =========================
   TOGGLE
========================= */

function toggleTask(index) {

    tasks[index].done =
        !tasks[index].done;


    saveTasks();

    renderTasks();

}


/* =========================
   DELETE
========================= */

function deleteTask(index) {

    if (
        !confirm(
            "Delete this task?"
        )
    ) return;


    tasks.splice(
        index,
        1
    );


    saveTasks();

    renderTasks();

}


/* =========================
   STATISTICS
========================= */

function updateStats() {

    const total =
        tasks.length;


    const completed =
        tasks.filter(
            task => task.done
        ).length;


    const remaining =
        total - completed;


    const rate =
        total === 0
            ? 0
            : Math.round(
                completed /
                total *
                100
            );


    document.getElementById(
        "totalTasks"
    ).textContent =
        total;


    document.getElementById(
        "completedTasks"
    ).textContent =
        completed;


    document.getElementById(
        "remainingTasks"
    ).textContent =
        remaining;


    document.getElementById(
        "completionRate"
    ).textContent =
        rate + "%";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   SIGN OUT
========================= */

function signOut() {

    if (
        confirm(
            "Are you sure you want to sign out?"
        )
    ) {

        window.location.href =
            "auth.html";

    }

}


/* =========================
   START
========================= */

renderTasks();

</script>

</body>

</html>
